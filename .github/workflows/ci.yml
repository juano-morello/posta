name: CI

# S0.5 — "As a maintainer I want every push checked so that main is always
# deployable." Runs on every PR and on every push to main: install → lint →
# typecheck → test (with an 80% coverage floor) → build → dependency
# boundaries (S0.2), with pnpm store + turbo caching so a clean run stays
# fast, and real Postgres/Redis service containers so integration tests
# run against real datastores rather than mocks. Built up incrementally
# across T0.5.1–T0.5.5 — see this file's git history for how each stage
# was added and verified on its own.
on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch supersedes the previous run instead of
# queuing behind it — avoids burning CI minutes on a ref nobody will look at
# again.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only ever reads the repo and runs checks,
# it never comments, deploys, or publishes.
permissions:
  contents: read

jobs:
  ci:
    name: Install, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # DATABASE_URL/REDIS_URL are exactly what apps/api, apps/worker, and
    # tests/infra/redis-policy.test.ts read at boot/runtime (S0.3's env
    # schemas) — pointed at the service containers below, over localhost,
    # the same way docker-compose points them at the local dev stack. Fixed
    # dev-only credentials, identical to .env.example's docker-compose
    # defaults — not real secrets.
    env:
      DATABASE_URL: postgresql://posta:posta@localhost:5432/posta
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: posta
          POSTGRES_PASSWORD: posta
          POSTGRES_DB: posta
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U posta -d posta"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      # INV-7: the managed/CI Redis must run maxmemory-policy volatile-lru,
      # same requirement as docker/redis.conf for local dev — Redis does
      # double duty as the TTL'd link cache AND the no-TTL BullMQ event bus,
      # and allkeys-lru would silently evict queued jobs under memory
      # pressure. A service container can't mount a redis.conf (services
      # start before actions/checkout puts the repo on disk, so there is
      # nothing to mount yet), and a startup `command:`/`entrypoint:`
      # override is a real but very recently added (2026-04) GitHub Actions
      # field gated behind a rollout flag we have no way to confirm from
      # here (no remote, no runner) — and actionlint (last released
      # 2026-03-30) doesn't recognize the key yet either, so relying on it
      # would fail structural validation for no real gain. Reconfiguring
      # the policy at RUNTIME instead, once the container is already
      # healthy (the "Enforce Redis eviction policy" step below), needs
      # nothing but a plain job step and ioredis (already a workspace
      # devDependency) — the same kind of admin-API call a managed Redis
      # provider would require anyway (.env.example: "verify this on the
      # provider, not just in docker-compose").
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Keeps the CI Node version and .nvmrc (used for local dev) as
          # one source of truth instead of a second hardcoded version here.
          node-version-file: .nvmrc
          cache: pnpm

      # Turbo's own per-task cache, persisted between runs and keyed on the
      # lockfile (plan: "turbo caching keyed on the lockfile"). Separate
      # from the pnpm store cache above, which actions/setup-node's
      # cache:pnpm input already handles.
      - name: Cache turbo
        uses: actions/cache@v6
        with:
          path: '**/.turbo'
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the redis service's comment above: this is the CI-only
      # equivalent of docker/redis.conf's `maxmemory-policy volatile-lru`,
      # applied at runtime via CONFIG SET rather than a startup flag.
      # tests/infra/redis-policy.test.ts then asserts the LIVE policy over
      # REDIS_URL — same test either way this got set, local or CI.
      - name: Enforce Redis eviction policy (INV-7)
        run: |
          node -e "
            const Redis = require('ioredis');
            const redis = new Redis(process.env.REDIS_URL);
            redis.config('SET', 'maxmemory-policy', 'volatile-lru')
              .then(() => redis.quit())
              .then(() => process.exit(0))
              .catch((error) => { console.error(error); process.exit(1); });
          "

      # T2.3.4 review fixup — landed permanently now, not interim. This
      # comment used to flag T2.6.10 as still-pending and note that its
      # "own dedicated job" hadn't landed yet; that job is the `hot-path`
      # job below, and it does NOT take this step over. It runs ONLY the
      # S2.6 redirect suite (apps/api/src/redirect/test/), whose harness
      # (hot-path-harness.ts) stubs `lookupNetwork` outright and never
      # opens a real .mmdb file (see that file's own header) — the S2.6
      # suite has no dependency on data/geoip/ at all. What this step
      # actually feeds is unrelated: packages/core/src/geoip/loader.test.ts's
      # real-data tests (7 of its 13), which run in THIS job's own `core`
      # project and need the actual DB-IP .mmdb pair under data/geoip/,
      # git-ignored (T0.1.1) and never populated by `pnpm install` alone.
      # Without this, those 7 tests fail here with the loader's own "run
      # `pnpm geo:fetch`" guidance instead of a real assertion, every run.
      #
      # Cached by DB-IP's release month (UTC): the two files are ~18 MB
      # combined and DB-IP re-releases both monthly (scripts/fetch-geoip.sh's
      # own header) — every run within the same month reuses an earlier
      # run's download instead of re-pulling from download.db-ip.com. A
      # cache miss (new month, or the first run ever) falls through to a
      # real fetch. Exact-key only, no restore-keys: a restored PARTIAL
      # match from a prior month would report cache-hit=false and still
      # trigger a real fetch below anyway, so a fallback key would only add
      # a redundant partial download with no skip benefit.
      - name: Resolve GeoIP cache key (current UTC year-month)
        id: geoip-month
        run: echo "year_month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache GeoIP databases
        id: geoip-cache
        uses: actions/cache@v6
        with:
          path: data/geoip
          key: geoip-${{ steps.geoip-month.outputs.year_month }}

      # No `continue-on-error`, no `|| true`: fetch-geoip.sh already exits
      # non-zero (set -euo pipefail) on a genuine download failure, and this
      # step is left to fail the job loudly on that exit code rather than
      # swallowing it. Tolerating a failure here would not avoid a red
      # build — it would only move the failure 3 steps down to the 7 geoip
      # tests below, each reporting the loader's generic "file not found,
      # run pnpm geo:fetch" guidance instead of the real network/
      # availability problem. A red fetch step with fetch-geoip.sh's own
      # clear "could not download ... aborting" message is strictly more
      # debuggable than a red test suite pointing at the wrong cause.
      - name: Fetch GeoIP databases (data/geoip)
        if: steps.geoip-cache.outputs.cache-hit != 'true'
        run: pnpm geo:fetch

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # NOTE: no `--` before the flags. Unlike npm, pnpm forwards script
      # args literally — `pnpm test -- --coverage` would append a literal
      # "--" to the underlying `vitest run`, which vitest's CLI parses as
      # "stop parsing flags", turning --coverage into a positional test-name
      # filter instead of a flag (silently running with NO coverage, since
      # no test file is named "--coverage"). Verified locally: `pnpm test
      # -- --coverage` produces no coverage/ directory at all; `pnpm test
      # --project default --coverage` does.
      #
      # --project default --project web --project core: vitest.config.ts's
      # `projects` split (batch 9 review) put tests/containers/**
      # (image-smoke.test.ts, image-size.test.ts) in their own "containers"
      # project — those tests' beforeAll shells out to `docker compose
      # build/run` against services declaring `env_file: .env`, which THIS
      # workflow never writes (no images are built here at all). Running
      # the unscoped suite would try and fail to run them here — redundant
      # AND a false failure, since images.yml already owns them, run
      # targeted (`pnpm test tests/containers/image-smoke.test.ts` /
      # `image-size.test.ts`) right after it builds the images they need.
      # `default` runs every other test (including
      # tests/infra/redis-policy.test.ts, against the Redis service +
      # CONFIG SET step above); `web` (E6/S6.1) is apps/web's component
      # tests (*.test.tsx — Testing Library + jsdom), which live in their
      # own project because they need a DOM and a JSX transform the
      # 'default' project doesn't set up (see vitest.config.ts) — omitting
      # it here would mean every apps/web component test silently never
      # runs in CI even though `pnpm test <file>` passes locally; `core`
      # (T1.1.2, E1) is packages/core's own project
      # (packages/core/vitest.config.ts, 120s hookTimeout) — its
      # testcontainers-based integration tests boot a REAL Postgres via
      # the runner's own Docker daemon (already available on
      # ubuntu-latest, no service container needed) rather than the
      # postgres:// service above. All three projects' coverage still
      # computes/gates at 80% together — the container-build tests never
      # contributed application-source coverage in the first place.
      #
      # --project redirect-hot-path: vitest.config.ts excludes
      # apps/api/src/redirect/test/** from `default` (its own project block
      # above says why: fileParallelism: false there, to keep the
      # queue-down.test.ts flake fixed), so leaving it unnamed here means
      # this step silently runs NONE of the S2.6 suite and reports 0%
      # coverage for hot-path-harness.ts despite the dedicated `hot-path`
      # job below exercising it on every PR — the gate still holds (that
      # job is the real correctness check), only this step's OWN coverage
      # artifact was silently understating things. redirect-hot-path's
      # fileParallelism: false is structural in vitest.config.ts, not a CLI
      # flag, so naming the project here does not reintroduce that flake.
      - name: Test (with coverage)
        run: pnpm test --project default --project web --project core --project redirect-hot-path --coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14

      # Turbo resolves the contracts → core → {api, worker, web} build order
      # from each package's own turbo.json dependsOn, so one command builds
      # all five packages in the right order with caching. There is no root
      # "pnpm build" script — turbo.json's build task is invoked directly.
      #
      # Dedicated timeout: a clean-install `next build` was once observed to
      # print full success and then hang instead of exiting (suspected
      # first-run Turbopack native setup; did not reproduce on a second
      # run). This makes that fail loudly in ~5 minutes instead of silently
      # burning the whole job's 20-minute budget.
      - name: Build
        run: pnpm exec turbo run build
        timeout-minutes: 5

      # S0.2's dependency-arrow rules (.dependency-cruiser.js) only protect
      # the architecture (web→contracts · api→core,contracts ·
      # worker→core,contracts · core→contracts, no app importing another
      # app) if CI actually runs them — tests/boundaries/arrows.test.ts
      # already exercises the rules against fixtures as part of `pnpm
      # test` above, but this is the real scan over the actual apps/
      # and packages/ source, so a genuine illegal import (not just a
      # fixture) fails the build too.
      - name: Dependency boundaries (S0.2)
        run: pnpm depcruise

  # T6.5.9, fixed post-review — the gallery (T6.5.1-7) and its visual-
  # regression snapshots (T6.5.8, which also carries T6.1.12's no-FOUC
  # check and T6.2.10's every-primitive-in-both-themes check — both
  # explicitly deferred until /gallery existed) actually run here, not
  # just locally. A SEPARATE job, not a step in `ci` above, and it runs
  # INSIDE the exact `mcr.microsoft.com/playwright:v1.61.1-noble` image
  # (version pinned to match @playwright/test's own package.json version
  # exactly — bump both together) that the committed `*-linux.png`
  # baselines were generated from.
  #
  # This container is load-bearing, not a convenience: the first attempt
  # at this job ran plain `ubuntu-latest` + `playwright install
  # --with-deps chromium`, and CI still failed against freshly-generated
  # Linux baselines — "Linux" alone doesn't guarantee matching pixels.
  # `--with-deps` pulls whatever font/library versions happen to be
  # current in Ubuntu's apt repos on the day the job runs, which is NOT
  # the same fixed, reproducible font stack Microsoft bakes into the
  # versioned Playwright image. Running the test itself inside that same
  # image is what actually makes local-baseline-generation and CI
  # rendering deterministic against each other, not just "both Linux".
  #
  # Scoped to gallery.spec.ts + gallery-visual.spec.ts specifically — this
  # job's own name says "visual regression", and the OTHER apps/web e2e
  # specs (shell/islands/honesty-a11y/safe-area) are a pre-existing gap
  # this task does not claim to close.
  visual-regression:
    name: Visual regression (gallery + primitives)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image ships Node + corepack already (verified: node v24,
      # matching .nvmrc's major version 24) — no actions/setup-node here,
      # that would just fight the container's own preinstalled runtime.
      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/web imports @posta/contracts by package name (dist/, built
      # output) — this job doesn't run `turbo run build` for the other
      # four packages (api/core/worker have nothing this suite touches),
      # just the one real dependency.
      - name: Build contracts
        run: pnpm --filter @posta/contracts build

      # webServer (playwright.config.ts) runs its own `pnpm build && next
      # start` — a real `next build`, not shared with the `ci` job above
      # (separate job, separate checkout, no cache between them).
      - name: Visual regression (gallery + primitives)
        run: pnpm --filter @posta/web exec playwright test gallery.spec.ts gallery-visual.spec.ts

      # Playwright's own HTML reporter (playwright.config.ts: `[['html',
      # {open:'never'}], ['github']]` in CI) embeds the actual/expected/
      # diff images for any failed screenshot comparison directly in the
      # report — this is what makes "a snapshot break is reviewable from
      # the PR" true, rather than just a pass/fail line in the log.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14

  # T1.5.4 — "As a developer I want one command for both migration
  # flavors so that hand-written SQL is not second-class" (S1.5). This is
  # what actually catches drift: a schema change committed without
  # regenerating the drizzle migration, or a migrations/sql/*.sql file
  # renamed or edited after being applied (sql-migrate.ts's checksum
  # check throws on exactly that). A separate job, not a step tacked onto
  # `ci` above — GitHub Actions jobs get their own fresh runner and their
  # own fresh service containers by default, which is genuinely "from
  # empty" with no explicit teardown needed, and keeps this fast,
  # narrowly-scoped check from being coupled to the main job's lint/test/
  # build timing.
  migrate-from-empty:
    name: Migrate from empty
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql://posta:posta@localhost:5432/posta
      # createDbClient()'s resolvePoolMax() (packages/core/src/db/client.ts,
      # T1.1.1) requires DB_POOL_MAX explicitly — pool max is never left to
      # the pg driver default on purpose (CLAUDE.md). Without this, `pnpm
      # migrate` in this job fails immediately with "DB_POOL_MAX must be
      # set" before it ever reaches Postgres — confirmed live on PR #3.
      DB_POOL_MAX: '5'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: posta
          POSTGRES_PASSWORD: posta
          POSTGRES_DB: posta
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U posta -d posta"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Drizzle's migrations, then the hand-written SQL ones, in the
      # fixed order T1.5.1 asserts — against a genuinely empty database
      # (a brand-new service container for this job), so this either
      # produces every table/function/partition or fails loudly.
      - name: pnpm migrate
        run: pnpm migrate

      # The real gate: exits non-zero if anything drizzle-kit or the sql
      # runner tracks as unapplied is still pending after the migrate
      # step above — which is exactly the "drift" this job exists to
      # catch (an edited already-applied file fails migrate itself, via
      # the checksum check; a genuinely NEW, un-migrated file would show
      # up here as PENDING instead).
      - name: pnpm migrate:status
        run: pnpm migrate:status

  # T2.6.10 — "the invariant suite is documentation with extra steps"
  # unless CI actually re-runs it on every PR. This is the job the "T2.3.4
  # review fixup" comment in `ci` above was pointing at: its own dedicated
  # job, same reasoning as `visual-regression` and `migrate-from-empty`
  # above — a separate, focused pass/fail line and its own timeout,
  # decoupled from the main `ci` job's already-heavy lint/typecheck/test/
  # build/depcruise budget (20 minutes).
  #
  # DIVERGENCE FROM THIS TASK'S OWN DISPATCH BRIEF, recorded rather than
  # silently made: the brief describes this job as "using the Postgres and
  # Redis service containers from T0.5.2" (the `ci` job's `services:`
  # block above). It deliberately does NOT get one here. Every S2.6 spec
  # under apps/api/src/redirect/test/ goes through ONE shared factory,
  # `startHotPathHarness` (test/hot-path-harness.ts, T2.6.1), which boots
  # its OWN Postgres + Redis testcontainers pair per test file
  # (`startPgContainer`/`startRedisContainer`, `@posta/core/testing`)
  # against the runner's own Docker daemon — already available on
  # `ubuntu-latest`, no service container needed, exactly like the `ci`
  # job's own `packages/core` project already does for its testcontainers
  # suite (see that job's "Test (with coverage)" step comment). The
  # harness sets `DATABASE_URL`/`REDIS_URL` on `process.env` itself,
  # pointed at whichever ephemeral container IT just started
  # (hot-path-harness.ts's own `createEnvSetter`) — it never reads either
  # var pointed at a `services:` block the way the `ci` job's OTHER tests
  # do. A `postgres`/`redis` services block here would sit entirely
  # unused: harmless to add for literal faithfulness to the brief's own
  # wording, but also pure dead YAML, so it is omitted rather than kept
  # around as decoration nothing ever connects to.
  #
  # No GeoIP fetch step either: hot-path-harness.ts's own `lookupNetwork`
  # is a fixed stub (`() => ({ asn: null, country: null })`), never
  # `createNetworkLookup(openGeoDatabases(...))` — see that file's own
  # header. None of the real `data/geoip/*.mmdb` files are ever read by
  # any S2.6 test, so fetching them here would cost real time (the `ci`
  # job's own cache-miss path shells out to download.db-ip.com) for zero
  # coverage benefit.
  #
  # `--no-file-parallelism`: EVERY file in this suite boots its own
  # Postgres+Redis container pair, and Vitest parallelizes test files
  # across workers by default — running all of them (7 today, 9 once
  # T2.6.3/T2.6.7 land) at once means that many concurrent container
  # pairs contending for the runner's CPU. Verified locally, not merely
  # theorized: `pnpm test apps/api/src/redirect/test/` (default
  # parallelism) intermittently failed queue-down.test.ts under that
  # contention — one run reported 51 enqueue-failure log lines where
  # exactly 50 were expected (a timing-sensitive polling assertion
  # slipping under load), while the SAME file passed cleanly every time
  # run in isolation. `--no-file-parallelism` (Vitest's own flag,
  # equivalent to `fileParallelism: false` in vitest.config.ts, already
  # used there for the unrelated `containers` project's own concurrent-
  # docker-build contention) serializes the 7-9 files instead, and the
  # exact same suite then passed 44/44 repeatably. The wall-clock cost is
  # real (~26s serial vs ~9s parallel-but-flaky, measured locally) but
  # trivial against this job's own 15-minute budget — a slower, honestly
  # green job beats a faster, intermittently red one for a suite whose
  # whole purpose is to be trusted without anyone re-running it by hand.
  #
  # Scoped to apps/api/src/redirect/test/ (the 7-9 S2.6 integration files,
  # T2.6.1-T2.6.9, each reusing the one real harness described above) PLUS
  # exactly one named file living outside it,
  # apps/api/src/redirect/ordering.test.ts — not the whole
  # apps/api/src/redirect/ directory. The rest of that wider directory
  # (host.test.ts, resolve-link.test.ts, capture.test.ts, ...) is the
  # older S2.1-S2.5 unit suite, already exercised by the `ci` job's own
  # "Test (with coverage)" step (its `default` project's include glob
  # already matches `apps/**/*.test.ts`) — running it again here would be
  # redundant, not a gap this job needs to close. Measured both ways
  # locally from the same clean tree: the whole directory is 28 files /
  # 350 tests, ~54s; this job's actual scope below is 10 files / 60
  # tests, ~32s — widening to the whole directory would cost ~75% more
  # wall-clock time here for zero net new coverage (every one of those
  # extra 18 files already runs, and already gates, in the `ci` job).
  #
  # [T2.6.10, second pass] `ordering.test.ts` IS pulled in by name,
  # deliberately, even though the paragraph above just argued against its
  # siblings. This job's own plan verify line
  # (docs/plan/02-redirect-hot-path.md) promises it "goes red on a branch
  # that moves the `queue.add` call above `res.redirect`" — and the FIRST
  # pass of this task shipped that promise unverified. Checked
  # empirically: the literal single-change regression (move the
  # analytics/enqueue block — try/catch and fire-and-forget `.catch()`
  # both left intact — above `sendLinkRedirect`, nothing else touched)
  # left this job's test/-only scope GREEN, 9/9 files, 52/52 tests. The
  # ONLY spec anywhere in this repo that actually catches that exact
  # reorder is ordering.test.ts's own "the res.end timestamp strictly
  # precedes the first queue.add call" assertion (T2.4.3) — and that file
  # sat one level above this job's old scope, in
  # apps/api/src/redirect/ directly, so this job never ran it and the
  # regression sailed through. Naming it here closes that gap the
  # cheapest way available: one explicit file, not a 75%-slower directory
  # widen that would re-run 18 files this job has no business owning. See
  # docs/plan/IMPLEMENTATION-NOTES.md's T2.6.10 entry for the full
  # before/after proof (the RED assertion text, and the confirmed
  # byte-identical revert of middleware.ts after). Do NOT "tidy" this back
  # down to a bare `apps/api/src/redirect/test/` — that silently reopens
  # the exact hole this comment exists to keep closed.
  hot-path:
    name: Hot path invariant suite (S2.6)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Found by actually running this job's own steps against a fresh
      # checkout, not assumed: every S2.6 spec imports `@posta/contracts`
      # and `@posta/core` by PACKAGE NAME, and both resolve to real `dist/`
      # output (package.json's own `main`/`exports`, e.g.
      # `./dist/index.js`) — there is no source-file alias for either in
      # vitest.config.ts. The `ci` job above never runs an explicit build
      # step before ITS OWN "Test (with coverage)" step either, but gets
      # away with it for a reason that does NOT carry over to a separate
      # job on a separate runner: its own "Typecheck" step runs `tsc -b`
      # (project-reference BUILD mode, not `--noEmit`) over exactly these
      # packages, which — because packages/contracts/tsconfig.json and
      # packages/core/tsconfig.json both set `composite: true` with no
      # `noEmit` — emits real `dist/**` as a side effect ahead of that same
      # job's Test step. THIS job has no typecheck step and no shared
      # filesystem with the `ci` job's runner (separate jobs never share a
      # runner or its disk), so without building explicitly here, the step
      # below fails immediately with "Failed to resolve entry for package
      # @posta/contracts" — reproduced locally against a genuinely fresh
      # checkout before adding this step, confirmed fixed after. `--filter
      # @posta/core` is enough on its own: turbo.json's `build` task
      # declares `dependsOn: ["^build"]`, so turbo builds `@posta/contracts`
      # first (core's own workspace dependency) without a second, separate
      # filter — mirrors the `ci` job's own final Build step comment on how
      # turbo resolves this same contracts -> core order.
      - name: Build contracts + core
        run: pnpm exec turbo run build --filter=@posta/core

      # No DATABASE_URL/REDIS_URL env needed here, unlike the `ci` job
      # above — see this job's own header for why: every S2.6 spec boots
      # its own real Postgres+Redis testcontainers pair and points itself
      # at it, over the runner's own Docker daemon. `ordering.test.ts`
      # (added second pass, see this job's own header comment) needs
      # neither — it drives a real Express+http server directly, no
      # container of its own, so appending it here adds no new
      # infrastructure requirement, only ~2s of wall-clock (32s vs 30s
      # measured locally, test/ alone vs test/ + this file).
      - name: Hot path invariant suite (S2.6)
        run: pnpm test apps/api/src/redirect/test/ apps/api/src/redirect/ordering.test.ts --no-file-parallelism
