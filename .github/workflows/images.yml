name: Images

# T0.7.14 — S0.7's last acceptance bullet: "CI builds all three and pushes
# them tagged with the git SHA." Runs on push to main only (never on a
# PR): a PR is unreviewed by definition, and pushing an image built from
# it to the registry ahead of review would be backwards.
#
# ############################################################################
# The registry is GHCR — `vars.REGISTRY` is `ghcr.io/<owner>` (CLAUDE.md
# decision log, 2026-07-26). Being the same-org registry, it authenticates
# with the GITHUB_TOKEN Actions mints per run, so there is no long-lived
# registry credential anywhere in this repo and no REGISTRY_USERNAME /
# REGISTRY_PASSWORD secret to create. `packages: write` below is what makes
# that token able to push; without it the push 403s.
#
# STILL UNPROVEN (S0.7, T0.7.14 / see docs/plan/00-foundation.md): this file
# has never completed a real push. T0.7.14 stays blocked until a merge to
# main actually produces three digests — nothing here should be read as a
# claim that it already has. The build + smoke + size steps DO run for real
# value regardless (they gate main on the same real images T0.7.12/13
# already test); the login/push steps stay inert on any checkout where
# REGISTRY is unset, e.g. a fork.
# ############################################################################
on:
  push:
    branches: [main]

concurrency:
  group: images-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a push that might already be mid-push to the registry —
  # unlike ci.yml's PR checks, a half-pushed image tag is worse than a
  # slow one.
  cancel-in-progress: false

permissions:
  contents: read
  # The GHCR push credential itself: this is what the per-run GITHUB_TOKEN
  # needs to write packages. Drop it and every push below 403s.
  packages: write

env:
  # The registry host stays bound late, via a plain repository/organization
  # variable, never a hardcoded host — repointing it is a settings change,
  # not a code change. Empty on any checkout that hasn't set it (a fork),
  # which is exactly why every push-side step below is gated on it being
  # non-empty rather than assuming it's set.
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  build-test-push:
    name: Build, smoke+size test, and push
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # docker-compose.yml's app services (T0.7.11) read their config from
      # `.env` via `env_file:`, the same way the host-run `pnpm dev` flow
      # does — but `.env` is git-ignored (never committed, T0.1.1) and a
      # fresh CI checkout has none. These are fixed CI-only placeholder
      # values, identical in spirit to ci.yml's own "Fixed dev-only
      # credentials... not real secrets" Postgres/Redis env — nothing here
      # is a real credential, and none of it is used past this job's
      # ephemeral runner.
      - name: Write a CI-only .env for docker compose
        run: |
          cat > .env <<'EOF'
          POSTA_LINK_DOMAIN=posta.test
          POSTA_APP_SUBDOMAIN=app
          POSTA_API_SUBDOMAIN=api
          POSTA_PROTOCOL=http
          POSTA_RESERVED_HANDLES=app,api,www,admin,static,assets,cdn,mail,blog,docs,status
          DATABASE_URL=postgresql://posta:posta@localhost:5432/posta
          DB_POOL_MAX=10
          POSTGRES_USER=posta
          POSTGRES_PASSWORD=posta
          POSTGRES_DB=posta
          DATABASE_URL_WORKER=postgresql://posta:posta@localhost:5432/posta
          REDIS_URL=redis://localhost:6379
          R2_ACCOUNT_ID=ci-placeholder
          R2_ACCESS_KEY_ID=posta-ci
          R2_SECRET_ACCESS_KEY=posta-ci-secret
          R2_BUCKET_EVENTS=posta-events
          R2_BUCKET_AVATARS=posta-avatars
          R2_ENDPOINT=http://localhost:9000
          GEOIP_DB_DIR=./data/geoip
          BETTER_AUTH_SECRET=ci-only-placeholder-secret-value
          BETTER_AUTH_URL=http://localhost:3000
          SEED_USER_EMAIL=ci@posta.test
          SEED_USER_PASSWORD=ci-only-placeholder-pw
          SEED_USER_HANDLE=ci
          NODE_ENV=production
          LOG_LEVEL=info
          API_PORT=3001
          WORKER_PORT=3002
          WEB_PORT=3000
          NEXT_PUBLIC_API_URL=http://localhost:3001
          REVALIDATE_SECRET=ci-only-placeholder-secret
          EVENT_BATCH_SIZE=100
          EVENT_BATCH_INTERVAL_MS=2000
          # Both mirror .env.example. SHUTDOWN_TIMEOUT_MS is load-bearing:
          # workerEnvSchema (T3.1.6) requires it with no default, so without
          # it the worker container fails boot validation. WORKER_CONCURRENCY
          # only defaults to 8 — T3.7.7 warns at boot when it sits below
          # EVENT_BATCH_SIZE, which is 100 above. Don't trim either.
          WORKER_CONCURRENCY=100
          SHUTDOWN_TIMEOUT_MS=30000
          LINK_CACHE_TTL_SECONDS=3600
          REDIS_LOOKUP_TIMEOUT_MS=30
          MAX_INFLIGHT_ENQUEUES=1000
          EOF

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds all three with the SAME buildx builder docker/setup-buildx-action
      # just installed as the default — `docker compose build` routes through
      # it automatically, so this already benefits from BuildKit's own layer
      # cache within this job. T0.7.12/13's tests below run against exactly
      # these images — nothing is allowed near the registry until they pass.
      # Note: this step doesn't write to the GHA cache (`cache-to`), only
      # the per-app push steps further down do — see their comment for why
      # that means the push steps can genuinely rebuild rather than reuse
      # this step's output, on a cold cache.
      - name: Build api/worker/web images
        run: docker compose build api worker web

      # T0.7.12 — a green `docker build` only proves the layers assembled;
      # this proves the images actually start and answer health before any
      # of them is allowed near the registry.
      - name: Smoke test built images
        run: pnpm test tests/containers/image-smoke.test.ts

      # T0.7.13 — the size budget gate (api/worker 300MB, web 250MB).
      - name: Enforce image size budgets
        run: pnpm test tests/containers/image-size.test.ts

      # From here on: everything is gated on REGISTRY being non-empty, so a
      # checkout without it (a fork) short-circuits to a no-op `if:`, never
      # a step that runs and silently fails or fakes success.
      - name: Log in to the registry
        if: ${{ env.REGISTRY != '' }}
        uses: docker/login-action@v4
        with:
          # REGISTRY carries the owner path too (`ghcr.io/<owner>`); docker
          # login keeps only the host, so one variable serves both this and
          # the image refs below.
          registry: ${{ env.REGISTRY }}
          # GHCR takes the token Actions mints for this run — scoped to this
          # repo, expires with the job, nothing long-lived to rotate or leak.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-invokes buildx per app, this time with `cache-from`/`cache-to:
      # type=gha`. That cache persists ACROSS workflow runs, not within this
      # one — the "Build api/worker/web images" step above never writes to
      # it (plain `docker compose build`, no `cache-to`) — so this is only a
      # fast, no-op-ish rebuild on the SECOND and later runs, once a prior
      # run's `cache-to` has actually populated it. The very first run (or
      # any run after a Dockerfile change invalidates the cached layers)
      # genuinely rebuilds from scratch here. Either way the pushed image is
      # the same correct artifact the tests above already exercised — the
      # cache only changes how long getting there takes, never what gets
      # pushed.
      #
      # Tagging: the SHA tag is unconditional — it is the one a rollback can
      # actually pin to (plan: "a deploy pinned to `latest` cannot be rolled
      # back to a known artifact"). `latest` is only a convenience pointer,
      # so it moves on main and nowhere else; off main the expression yields
      # an empty line, which the action's tag-list parser discards. The
      # trigger is main-only today, so that guard never fires in practice —
      # it exists so widening the trigger later can't quietly start moving
      # `latest` from a branch build.
      - name: Push api image
        if: ${{ env.REGISTRY != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/posta-api:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/posta-api:latest', env.REGISTRY) || '' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Push worker image
        if: ${{ env.REGISTRY != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/posta-worker:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/posta-worker:latest', env.REGISTRY) || '' }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Push web image
        if: ${{ env.REGISTRY != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/posta-web:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}/posta-web:latest', env.REGISTRY) || '' }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
