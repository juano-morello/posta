# Posta — local dev Redis config (S0.4, T0.4.2).
#
# Mounted into the container rather than passed as a `redis-server --flag`
# CLI override, so the eviction policy stays reviewable in a diff — see
# CLAUDE.md's decision log and invariant 7-adjacent rule (INV-7).
#
# Redis does double duty here: the TTL'd hot link cache AND the no-TTL
# BullMQ event bus. Under `allkeys-lru`, a queue backlog would silently
# evict its own jobs and events would vanish with no error anywhere.
# `volatile-lru` only evicts keys that carry a TTL, so un-TTL'd queue
# jobs are never eviction candidates no matter how full memory gets.
maxmemory 256mb
maxmemory-policy volatile-lru

# Bind to all interfaces inside the container's own network namespace —
# the container boundary is the real access control here (only exposed
# to the host via compose's port mapping), not Redis's own bind list.
bind 0.0.0.0

# protected-mode no is REQUIRED here, not just permitted: the host reaches
# this container across the container network boundary, which Redis sees
# as a non-loopback connection. `protected-mode yes` (the default) refuses
# non-loopback connections that have no password set — so enabling it
# without also setting a password would break the host's own connection,
# not just outside attackers. This is safe ONLY because docker-compose.yml
# publishes redis's port as `127.0.0.1:6379:6379`, not `6379:6379` — that
# loopback binding is what actually keeps this off the local network; this
# setting has no independent access control of its own. If that port
# mapping is ever changed back to publish on all interfaces, this line
# must not be "fixed" by itself (it would break dev without closing the
# real exposure) — add a requirepass instead, or revert the port mapping.
protected-mode no
