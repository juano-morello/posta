# Posta — local dev infrastructure (S0.4).
#
# Only datastores run here. The apps (api, worker, web) run on the HOST in
# watch mode via `pnpm dev` (T0.4.6) — container images for the apps
# themselves are a later story (S0.7). Credentials come from `.env` at the
# repo root (copy `.env.example`); compose loads it automatically because
# it lives next to this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The eviction policy lives in the mounted config file (INV-7), not a
    # CLI flag, so it stays reviewable in a diff.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6379:6379"
    volumes:
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Reuses the app's own R2_ACCESS_KEY_ID/R2_SECRET_ACCESS_KEY (see
      # .env.example) as MinIO's root credentials, so local dev has one
      # pair of values instead of two that could drift apart.
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY}
    ports:
      - "9000:9000" # S3 API — what the app's R2_ENDPOINT points at
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot: creates the app's two buckets if absent, then exits 0. Runs
  # on every `up`, not just the first — mc mb --ignore-existing makes that
  # safe — so a fresh clone needs no manual console step. Depends on all
  # three datastores' healthchecks, not just minio's — its own clean exit
  # then doubles as a "the whole stack is ready" signal, matching what
  # `pnpm dev`'s `docker compose up -d --wait` (T0.4.6) actually waits on:
  # apps started before this converges would otherwise crash-loop against
  # infra that looks up but isn't accepting connections yet.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${R2_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_EVENTS: ${R2_BUCKET_EVENTS}
      R2_BUCKET_AVATARS: ${R2_BUCKET_AVATARS}
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh:ro

volumes:
  postgres-data:
  redis-data:
  minio-data:
